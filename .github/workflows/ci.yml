name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build examples
        run: python scripts/build_examples.py

      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/test_sem_tool.py -k "not slow"

      - name: Smoke import web module
        run: python -c "from sem_tool.web import pipeline; print('ok')"
